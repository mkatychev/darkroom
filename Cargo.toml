[workspace.package]
edition = "2024"
version = "0.10.0"

authors = ["Mikhail Katychev <mkatych@gmail.com>"]
license = "GPL-3.0"
readme = "README.md"
repository = "https://github.com/mkatychev/darkroom"

[workspace]
members = [
  "cli",
  "filmreel",
]
resolver = "2"

[workspace.dependencies]
filmreel = { version = "0.9.2", path = "filmreel" }

anyhow = "1.0"
argh = "0.1"
chrono = "0.4"
colored = "3.0"
colored-diff = "0.2"
colored_json = "5.0"
glob  = "0.3.3"
http = "1.3.1"
jql = "8.0"
lazy_static = "1.5.0"
log = { version = "0.4", features = ["std"] }
paste = "1"
pest = "2.8"
pest_derive = "2.8"
pretty_assertions = "1.4.1"
prettytable-rs = "0.10"
pulldown-cmark ="0.12"
pulldown-cmark-mdcat = "2.7.1"
regex = "1.11.3"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls", "charset", "http2", "macos-system-configuration"] }
rstest = "0.26"
serde = { version = "1.0", features = ["derive"] }
serde-hashkey = { version = "0.4", features = ["ordered-float"] }
serde_json = "1.0"
syntect = "5.3"
url = "2.5"
which = "8"
# overflow broken for latest minus
minus = { version = "3.4.0", features = ["static_output"] }
derive_more = { version = "2", features = ["deref", "deref_mut"] }

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
